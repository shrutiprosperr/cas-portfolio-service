services:
  postgres:
    image: postgres:16
    container_name: cas-postgres
    environment:
      POSTGRES_USER: cas
      POSTGRES_PASSWORD: cas
      POSTGRES_DB: cas
    ports:
      - "5432:5432"
    volumes:
      - cas-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cas -d cas"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  cas-postgres-data:
